<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>젠플록스 · maison_jenflox</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F5F5;--surface:#fff;--border:#E8E8E8;--border-strong:#D0D0D0;
  --text-1:#111;--text-2:#555;--text-3:#999;
  --accent:#FFD600;--orange:#FF6B00;--orange-bg:#FFF0E6;
  --r:18px;--font:'Noto Sans KR',sans-serif;
  --sh:0 2px 12px rgba(0,0,0,.07);--sh2:0 8px 28px rgba(0,0,0,.13);
}
html,body{background:var(--bg);font-family:var(--font);color:var(--text-1);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:0;height:0}
.page{display:none;min-height:100vh}.page.active{display:block}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 60px}

/* ── PROFILE ── */
.profile{padding:48px 0 28px;display:flex;flex-direction:column;align-items:center;animation:fadeUp .5s ease both}
.av-wrap{position:relative;width:96px;height:96px;cursor:pointer;margin-bottom:20px}
.av-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border-radius:50%;z-index:3}
.av-circle{width:96px;height:96px;border-radius:50%;background:#DCDCDC;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--border-strong),var(--sh);transition:box-shadow .2s;display:flex;align-items:center;justify-content:center}
.av-wrap:hover .av-circle{box-shadow:0 0 0 2px var(--accent),var(--sh)}
.av-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av-ph{display:flex;flex-direction:column;align-items:center;gap:4px;color:#aaa}
.av-ph svg{width:28px;height:28px}
.av-ov{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,0);transition:background .2s;z-index:2;pointer-events:none}
.av-wrap:hover .av-ov{background:rgba(0,0,0,.12)}
.pname{font-size:26px;font-weight:900;letter-spacing:-.04em;margin-bottom:6px}
.phandle{font-size:15px;color:var(--text-3);letter-spacing:.02em}

/* ── ENTRY ── */
.entry-btn{width:100%;display:flex;align-items:center;gap:16px;background:var(--text-1);border:none;border-radius:var(--r);padding:20px 22px;cursor:pointer;font-family:var(--font);transition:all .2s;box-shadow:0 4px 18px rgba(0,0,0,.15);margin-bottom:10px}
.entry-btn:hover{background:#333;transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.22)}
.entry-icon{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.entry-text{flex:1;text-align:left}
.entry-title{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.025em;display:block}
.entry-sub{font-size:13px;color:rgba(255,255,255,.45);display:block;margin-top:2px}
.entry-arrow{color:rgba(255,255,255,.45);font-size:20px}

/* ── LINK CARDS ── */
.links{display:flex;flex-direction:column;gap:10px;animation:fadeUp .5s .1s ease both}
.lcard{background:var(--surface);border-radius:var(--r);border:1.5px solid var(--border);padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;text-decoration:none;color:inherit;transition:all .2s;box-shadow:var(--sh)}
.lcard:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--border-strong)}
.licon{width:46px;height:46px;border-radius:13px;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.ltitle{font-size:18px;font-weight:700;letter-spacing:-.025em;flex:1}
.larrow{color:var(--text-3);font-size:18px;flex-shrink:0;transition:transform .2s,color .2s}
.lcard:hover .larrow{transform:translate(2px,-2px);color:var(--text-1)}

/* ── BANNERS ── */
.banners{margin-top:10px;display:flex;flex-direction:column;gap:10px;animation:fadeUp .5s .2s ease both}
.banner{border-radius:var(--r);border:1.5px solid var(--border);overflow:hidden;cursor:pointer;transition:all .25s;box-shadow:var(--sh);text-decoration:none;color:inherit;display:block;background:var(--surface)}
.banner:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.banner-inner{padding:20px 22px;display:flex;align-items:center;gap:16px}
.bname{font-size:18px;font-weight:800;letter-spacing:-.03em;color:var(--text-1)}
.bhandle{font-size:13px;color:var(--text-3);margin-top:2px}
.bbtn{flex-shrink:0;padding:8px 16px;border-radius:999px;border:none;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.yt-banner:hover{border-color:rgba(255,0,0,.4)}
.yt-ico{width:52px;height:52px;border-radius:14px;background:#FF0000;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(255,0,0,.3)}
.yt-btn{background:#FF0000;color:#fff}.yt-btn:hover{background:#CC0000}
.ig-banner{position:relative}
.ig-banner::before{content:'';position:absolute;inset:-1.5px;border-radius:calc(var(--r) + 1.5px);background:linear-gradient(135deg,#FFDC80,#F77737,#C13584,#833AB4);z-index:0;opacity:0;transition:opacity .25s}
.ig-banner:hover::before{opacity:1}
.ig-banner .banner-inner{position:relative;z-index:1;background:var(--surface);border-radius:var(--r)}
.ig-ico{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#FFDC80,#F77737 40%,#C13584 75%,#833AB4);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(193,53,132,.3)}
.ig-btn{background:#0095F6;color:#fff}.ig-btn:hover{background:#007ACC}
.kk-banner{border-color:var(--border);background:var(--surface)}
.kk-banner:hover{background:#FAFAFA;border-color:var(--border-strong);box-shadow:0 8px 28px rgba(0,0,0,.1)}
.kk-ico{width:52px;height:52px;border-radius:14px;background:#FEF01B;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(254,229,0,.4)}
.kk-btn{background:#FFD600;color:#3A1D1D;font-weight:800}.kk-btn:hover{background:#E5C000}
.kk-banner .bname{color:var(--text-1)}
.kk-banner .bhandle{color:var(--text-3);opacity:1}

.footer{text-align:center;margin-top:44px;font-size:13px;color:var(--text-3);line-height:2}
.footer-dot{font-size:18px;margin-bottom:4px;display:block;color:#CCC}

/* ── ITEMS PAGE ── */
.iph{position:sticky;top:0;z-index:200;background:rgba(245,245,245,.97);backdrop-filter:blur(12px);padding:16px 16px 0;border-bottom:1px solid var(--border)}
.back-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1.5px solid var(--border-strong);color:var(--text-1);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;line-height:1}
.back-btn:hover{background:var(--text-1);color:#fff;border-color:var(--text-1)}
.ptitle{font-size:20px;font-weight:900;letter-spacing:-.04em}
.fhint{font-size:13px;color:var(--text-3);padding-left:2px;margin-bottom:10px}
.fscroll{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px}
.fbtn{flex-shrink:0;padding:10px 18px;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-2);font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap}
.fbtn:hover{border-color:#4A90D9;background:#EEF5FF}
.fbtn.active{background:#2563EB;border-color:#2563EB;color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.swrap{padding:10px 16px 12px}
.sinner{position:relative}
.sinner svg.si{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-3);pointer-events:none;transition:color .18s}
.sinput{width:100%;padding:13px 16px 13px 44px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);font-family:var(--font);font-size:15px;color:var(--text-1);outline:none;transition:border-color .18s;box-shadow:var(--sh)}
.sinput::placeholder{color:var(--text-3)}
.sinput:focus{border-color:var(--text-1);box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.sinner:focus-within svg.si{color:var(--text-1)}
.sclear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);font-size:20px;padding:2px;display:none}
.sclear.vis{display:block}
.ibody{padding:6px 16px 0}
.fcnt{font-size:13px;color:var(--text-3);margin-bottom:10px;padding-left:2px;min-height:18px}
.fcnt.hi{color:var(--text-1);font-weight:700}
.ilist{display:flex;flex-direction:column;gap:10px}
.icard{background:var(--surface);border-radius:14px;border:1.5px solid var(--border);cursor:pointer;transition:all .2s;box-shadow:var(--sh);animation:itemIn .3s ease both;display:flex;align-items:center;gap:14px;padding:14px 16px}
.icard:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--border-strong)}
.ithumb{width:88px;height:88px;border-radius:14px;flex-shrink:0;position:relative;background:#EFEFEF;border:2px solid var(--border);overflow:hidden;cursor:default}
.admin-mode .ithumb{cursor:pointer}
.ithumb img{width:100%;height:100%;object-fit:cover;display:block}
.ithumb input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:3;pointer-events:none}
.admin-mode .ithumb input[type=file]{pointer-events:auto}
.ithumb-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#bbb}
.ithumb-ph svg{width:26px;height:26px}
.iinfo{flex:1;min-width:0}
.ititle{font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.45}
.iarrow{color:var(--text-3);font-size:18px;flex-shrink:0;transition:transform .2s,color .2s}
.icard:hover .iarrow{transform:translate(2px,-2px);color:var(--text-1)}
.nores{text-align:center;padding:48px 20px;color:var(--text-3);font-size:15px;display:none}

/* ── CROP ── */
.crop-modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center}
.crop-modal.open{display:flex}
.crop-con{position:relative;width:280px;height:280px;background:#000;overflow:hidden;touch-action:none;border-radius:14px;border:3px solid #FFD600}
.crop-img{position:absolute;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
.crop-frame{position:absolute;inset:0;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none}
.crop-acts{display:flex;gap:12px;margin-top:20px}
.crop-btn{padding:13px 30px;border-radius:999px;border:none;font-family:var(--font);font-size:16px;font-weight:700;cursor:pointer;transition:all .15s}
.crop-cancel{background:rgba(255,255,255,.15);color:#fff}.crop-cancel:hover{background:rgba(255,255,255,.25)}
.crop-confirm{background:#FFD600;color:#111}.crop-confirm:hover{background:#E5C000}
.crop-hint{color:rgba(255,255,255,.4);font-size:12px;margin-top:10px;text-align:center}

/* ══════════════════════════════════════
   ADMIN PAGE
══════════════════════════════════════ */
#adminPage{background:#F0F0F0}
.admin-wrap{max-width:520px;margin:0 auto;padding:0 16px 80px}

/* 잠금 화면 */
.lock-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:fadeUp .4s ease both}
.lock-ico{font-size:48px;margin-bottom:8px}
.lock-title{font-size:22px;font-weight:900;letter-spacing:-.04em}
.lock-sub{font-size:14px;color:var(--text-3);margin-top:-8px}
.lock-input-wrap{position:relative;width:260px}
.lock-input{width:100%;padding:14px 48px 14px 18px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);font-family:var(--font);font-size:16px;outline:none;text-align:center;letter-spacing:.15em;transition:border-color .2s;box-shadow:var(--sh)}
.lock-input:focus{border-color:var(--text-1)}
.lock-input.err{border-color:#FF4444;animation:shake .3s ease}
.lock-btn{width:260px;padding:15px;border-radius:14px;background:var(--text-1);color:#fff;border:none;font-family:var(--font);font-size:16px;font-weight:800;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.lock-btn:hover{background:#333;transform:translateY(-1px)}
.lock-hint{font-size:12px;color:var(--text-3)}

/* 관리자 헤더 */
.admin-header{position:sticky;top:0;z-index:100;background:rgba(240,240,240,.97);backdrop-filter:blur(12px);padding:16px 16px 12px;border-bottom:1px solid var(--border);margin:0 -16px;padding-left:32px;padding-right:32px}
.admin-header-row{display:flex;align-items:center;justify-content:space-between}
.admin-title{font-size:20px;font-weight:900;letter-spacing:-.04em}
.admin-logout{padding:7px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--border-strong);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;color:var(--text-2);transition:all .15s}
.admin-logout:hover{background:var(--text-1);color:#fff;border-color:var(--text-1)}
.save-badge{font-size:12px;color:#22AA55;font-weight:700;display:none}
.save-badge.vis{display:block}

/* 섹션 */
.admin-section{margin-top:20px}
.as-title{font-size:13px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;padding-left:2px}

/* 카테고리 탭 선택 */
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cat-tab{padding:8px 16px;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap}
.cat-tab:hover{border-color:#4A90D9}
.cat-tab.active{background:#2563EB;border-color:#2563EB;color:#fff}

/* 아이템 편집 행 */
.edit-list{display:flex;flex-direction:column;gap:8px}
.edit-row{background:var(--surface);border-radius:14px;border:1.5px solid var(--border);padding:12px 14px;box-shadow:var(--sh);transition:border-color .15s}
.edit-row.dragging{opacity:.5;border-color:var(--accent);box-shadow:0 4px 20px rgba(255,214,0,.3)}
.edit-row.drag-over{border-color:var(--accent);border-style:dashed}
.edit-row-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.drag-handle{width:28px;height:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:grab;flex-shrink:0;color:#CCC;transition:color .15s}
.drag-handle:hover{color:#999}
.drag-handle:active{cursor:grabbing}
.drag-handle span{width:18px;height:2px;background:currentColor;border-radius:2px;display:block}
.vis-toggle{width:36px;height:20px;border-radius:999px;background:#DDD;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.vis-toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.vis-toggle.on{background:#22AA55}
.vis-toggle.on::after{transform:translateX(16px)}
.cat-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent);color:#111;white-space:nowrap;flex-shrink:0}
.del-btn{width:28px;height:28px;border-radius:8px;background:none;border:1.5px solid #FFB3B3;color:#FF6666;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.del-btn:hover{background:#FF6666;color:#fff;border-color:#FF6666}
.edit-fields{display:flex;flex-direction:column;gap:8px}
.ef-label{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.04em;margin-bottom:3px}
.ef-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-family:var(--font);font-size:14px;color:var(--text-1);outline:none;transition:border-color .15s}
.ef-input:focus{border-color:var(--text-1);background:#fff}
.ef-select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-family:var(--font);font-size:14px;color:var(--text-1);outline:none;cursor:pointer;transition:border-color .15s}
.ef-select:focus{border-color:var(--text-1)}

/* 추가 버튼 */
.add-item-btn{width:100%;padding:14px;border-radius:14px;border:2px dashed var(--border-strong);background:transparent;font-family:var(--font);font-size:15px;font-weight:700;color:var(--text-3);cursor:pointer;transition:all .2s;margin-top:4px}
.add-item-btn:hover{border-color:var(--accent);color:var(--text-1);background:rgba(255,214,0,.05)}

/* 저장 버튼 */
.save-btn{width:100%;padding:16px;border-radius:14px;background:var(--text-1);color:#fff;border:none;font-family:var(--font);font-size:17px;font-weight:800;cursor:pointer;transition:all .2s;box-shadow:0 4px 18px rgba(0,0,0,.15);margin-top:20px}
.save-btn:hover{background:#333;transform:translateY(-2px)}
.save-btn:active{transform:scale(.98)}

/* 미리보기 링크 */
.preview-link{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--text-3);text-decoration:none;cursor:pointer}
.preview-link:hover{color:var(--text-1)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes itemIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>

<!-- ══ HOME PAGE ══ -->
<div class="page active" id="homePage">
<div class="wrap">
  <div class="profile">
    <div class="av-wrap" title="클릭해서 사진 변경">
      <input type="file" accept="image/*" id="avatarInput">
      <div class="av-circle" id="avCircle">
        <div class="av-ph" id="avPh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <img id="avImg" src="" alt="" style="display:none">
      </div>
      <div class="av-ov"></div>
    </div>
    <div class="pname">젠플록스/전현표입니다.</div>
    <div class="phandle">@maison_jenflox</div>
  </div>

  <button class="entry-btn" onclick="goItems()">
    <div class="entry-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <div class="entry-text">
      <span class="entry-title">컨텐츠 링크 모음</span>
      <span class="entry-sub">카테고리별 아이템 탐색</span>
    </div>
    <span class="entry-arrow">›</span>
  </button>

  <div class="links">
    <button class="lcard" onclick="goItems('deal')" style="border:none;text-align:left;width:100%;">
      <div class="licon" style="background:var(--orange-bg);border-color:rgba(255,107,0,.2);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <span class="ltitle">한정기간 특가템</span>
      <span class="larrow">›</span>
    </button>
  </div>

  <div class="banners">
    <a class="banner yt-banner" href="https://www.youtube.com/@maison_jenflox" target="_blank" rel="noopener">
      <div class="banner-inner">
        <div class="yt-ico">
          <svg width="26" height="20" viewBox="0 0 26 20" fill="none"><rect width="26" height="20" rx="5" fill="#FF0000"/><polygon points="10,5 10,15 19,10" fill="white"/></svg>
        </div>
        <div style="flex:1"><div class="bname">전현표입니다</div><div class="bhandle">@maison_jenflox</div></div>
        <button class="bbtn yt-btn" onclick="event.preventDefault();window.open('https://www.youtube.com/@maison_jenflox','_blank')">구독</button>
      </div>
    </a>
    <a class="banner ig-banner" href="https://instagram.com/maison_jenflox" target="_blank" rel="noopener">
      <div class="banner-inner">

      <div class="edit-row-top">
        <div class="drag-handle" title="드래그로 순서 변경">
          <span></span><span></span><span></span>
        </div>
        <button class="vis-toggle${item.vis?' on':''}" title="${item.vis?'표시중':'숨김'}"></button>
        <span class="cat-badge">${CAT_LABELS[curAdminCat]}</span>
        <button class="del-btn" title="삭제">×</button>
      </div>
      <div class="edit-fields">
        <div>
          <div class="ef-label">항목 이름</div>
          <input class="ef-input" data-field="title" value="${esc(item.title)}" placeholder="이름 입력">
        </div>
        <div>
          <div class="ef-label">링크 URL</div>
          <input class="ef-input" data-field="href" value="${esc(item.href)}" placeholder="https://...">
        </div>
        <div>
          <div class="ef-label">카테고리 이동</div>
          <select class="ef-select">
            ${Object.entries(CAT_LABELS).map(([k,v])=>`<option value="${k}"${k===curAdminCat?' selected':''}>${v}</option>`).join('')}
          </select>
        </div>
      </div>`;

    // id 기반 헬퍼
    function getItem(){ return (DATA[curAdminCat]||[]).find(x=>x.id===itemId); }
    function getIdx(){ return (DATA[curAdminCat]||[]).findIndex(x=>x.id===itemId); }

    // 토글
    row.querySelector('.vis-toggle').addEventListener('click',function(){
      const it=getItem(); if(!it)return;
      it.vis=!it.vis;
      this.classList.toggle('on', it.vis);
      this.title=it.vis?'표시중':'숨김';
    });

    // 삭제 — 2단계 확인 (confirm() 은 iframe에서 차단됨)
    const delBtn = row.querySelector('.del-btn');
    let delArmed = false;
    let delTimer = null;
    delBtn.addEventListener('click', ()=>{
      if (!delArmed) {
        // 1단계: 경고 상태로 전환
        delArmed = true;
        delBtn.textContent = '삭제?';
        delBtn.style.cssText = 'width:50px;font-size:11px;background:#FF4444;color:#fff;border-color:#FF4444;border-radius:8px;border:1.5px solid #FF4444;cursor:pointer;height:28px;';
        delTimer = setTimeout(()=>{
          delArmed = false;
          delBtn.textContent = '×';
          delBtn.style.cssText = '';
        }, 2500);
      } else {
        // 2단계: 실제 삭제
        clearTimeout(delTimer);
        const idx = getIdx();
        if (idx === -1) return;
        DATA[curAdminCat].splice(idx, 1);
        renderEditList();
      }
    });

    // 필드 편집 — id 기준으로 항상 최신 객체에 반영
    row.querySelectorAll('.ef-input').forEach(inp=>{
      inp.addEventListener('input',function(){
        const it=getItem(); if(!it)return;
        it[this.dataset.field]=this.value;
      });
    });

    // 카테고리 이동
    row.querySelector('.ef-select').addEventListener('change',function(){
      const newCat=this.value;
      if(newCat===curAdminCat)return;
      const idx=getIdx(); if(idx===-1)return;
      const [moved]=DATA[curAdminCat].splice(idx,1);
      DATA[newCat]=DATA[newCat]||[];
      DATA[newCat].push(moved);
      renderEditList();
    });

    // 드래그 (id 기반 인덱스 재계산)
    row.addEventListener('dragstart',e=>{
      dragSrcIdx=getIdx();
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    row.addEventListener('dragend',()=>{
      row.classList.remove('dragging');
      document.querySelectorAll('.edit-row').forEach(r=>r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';row.classList.add('drag-over');});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',e=>{
      e.preventDefault(); row.classList.remove('drag-over');
      const targetIdx=getIdx();
      if(dragSrcIdx===null||dragSrcIdx===targetIdx)return;
      const arr=DATA[curAdminCat];
      const [moved]=arr.splice(dragSrcIdx,1);
      arr.splice(targetIdx,0,moved);
      dragSrcIdx=null;
      renderEditList();
    });

    list.appendChild(row);
  });
}

function addItem(){
  DATA[curAdminCat]=DATA[curAdminCat]||[];
  // order:0 → 정렬 시 무조건 최상단, id는 타임스탬프로 고유성 보장
  DATA[curAdminCat].unshift({id:Date.now(), order:0, title:'새 항목', href:'#', vis:true});
  renderEditList();
  setTimeout(()=>{
    const rows=document.querySelectorAll('.edit-row');
    if(rows.length)rows[0].scrollIntoView({behavior:'smooth',block:'nearest'});
  },50);
}

// ══ ITEMS PAGE ═════════════════════════════════════════════
function setF(btn,f){
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); curF=f; render();
  btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
function onSearch(v){curS=v.trim();document.getElementById('sclear').classList.toggle('vis',!!curS);render();}
function clearSearch(){document.getElementById('sinput').value='';onSearch('');}

function getItems(){
  const cats=curF==='all'?Object.keys(DATA):[curF];
  let items=[];
  cats.forEach(c=>(DATA[c]||[]).forEach(it=>{if(it.vis)items.push({...it,cat:c});}));
  // order 오름차순 = litt.ly 순서 (order 없으면 id로 fallback, 새 항목은 order:0 → 최상단)
  items.sort((a,b)=>{
    const oa = (a.order!==undefined) ? a.order : 0;
    const ob = (b.order!==undefined) ? b.order : 0;
    return oa - ob;
  });
  if(curS)items=items.filter(it=>it.title.includes(curS));
  return items;
}

function render(){
  const list=document.getElementById('ilist');
  const nores=document.getElementById('nores');
  const cnt=document.getElementById('fcnt');
  const items=getItems();
  list.innerHTML='';
  if(!items.length){nores.style.display='block';cnt.textContent='';cnt.className='fcnt';return;}
  nores.style.display='none';
  const total=Object.values(DATA).flat().filter(it=>it.vis).length;
  cnt.textContent=(curF!=='all'||curS)?`${items.length}개의 결과`:`총 ${total}개`;
  cnt.className='fcnt'+(curF!=='all'||curS?' hi':'');

  items.forEach((item,i)=>{
    const card=document.createElement('div');
    card.className='icard';
    card.style.animationDelay=`${Math.min(i*.04,.3)}s`;
    const hasLink=item.href&&item.href!=='#';
    card.innerHTML=`
      <div class="ithumb" id="ith-${item.id}">
        ${item.thumb?`<img src="${item.thumb}" alt="">`:'<div class="ithumb-ph"><svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>'}
        <input type="file" accept="image/*" class="tfi">
      </div>
      <div class="iinfo"><div class="ititle">${esc(item.title)}</div></div>
      <span class="iarrow">${hasLink?'↗':'·'}</span>`;
    card.querySelector('.tfi').addEventListener('change',function(e){
      if(!isAdmin)return;
      e.stopPropagation();const f=e.target.files[0];if(!f)return;
      cropId=item.id;const rd=new FileReader();rd.onload=ev=>openCrop(ev.target.result);rd.readAsDataURL(f);
    });
    // 비관리자: 썸네일 클릭 시 파일창 열리지 않게
    card.querySelector('.tfi').addEventListener('click',function(e){
      if(!isAdmin){e.preventDefault();e.stopPropagation();}
    });
    if(hasLink){
      card.querySelector('.iinfo').addEventListener('click',()=>window.open(item.href,'_blank'));
      card.querySelector('.iarrow').addEventListener('click',()=>window.open(item.href,'_blank'));
    }
    list.appendChild(card);
  });
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ══ CROP ═══════════════════════════════════════════════════
function openCrop(src){
  const modal=document.getElementById('cropModal'),img=document.getElementById('cropImg'),con=document.getElementById('cropCon');
  modal.classList.add('open');
  img.onload=()=>{
    const cW=con.clientWidth,cH=con.clientHeight;
    const sc=Math.max(cW/img.naturalWidth,cH/img.naturalHeight);
    cs.scale=sc;cs.ox=(cW-img.naturalWidth*sc)/2;cs.oy=(cH-img.naturalHeight*sc)/2;applyT();
  };
  img.src=src;
}
function applyT(){const img=document.getElementById('cropImg');img.style.transform=`translate(${cs.ox}px,${cs.oy}px) scale(${cs.scale})`;img.style.transformOrigin='0 0';}
function closeCrop(){document.getElementById('cropModal').classList.remove('open');cropId=null;}
function confirmCrop(){
  const img=document.getElementById('cropImg'),con=document.getElementById('cropCon');
  const canvas=document.createElement('canvas');canvas.width=300;canvas.height=300;
  const ctx=canvas.getContext('2d');
  ctx.beginPath();ctx.arc(150,150,150,0,Math.PI*2);ctx.clip();
  ctx.drawImage(img,-cs.ox/cs.scale,-cs.oy/cs.scale,con.clientWidth/cs.scale,con.clientHeight/cs.scale,0,0,300,300);
  const url=canvas.toDataURL('image/jpeg',.92);
  for(const cat of Object.values(DATA)){const it=cat.find(x=>x.id===cropId);if(it){it.thumb=url;break;}}
  closeCrop();render();
}
(function(){
  const con=document.getElementById('cropCon');let lastD=null;
  function pos(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};}
  function dn(e){if(e.touches&&e.touches.length===2){lastD=null;return;}cs.drag=true;const p=pos(e);cs.sx=p.x-cs.ox;cs.sy=p.y-cs.oy;if(e.cancelable)e.preventDefault();}
  function mv(e){
    if(e.touches&&e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.sqrt(dx*dx+dy*dy);
      if(lastD!==null){const r=d/lastD,mx=(e.touches[0].clientX+e.touches[1].clientX)/2-con.getBoundingClientRect().left,my=(e.touches[0].clientY+e.touches[1].clientY)/2-con.getBoundingClientRect().top;cs.ox=mx-(mx-cs.ox)*r;cs.oy=my-(my-cs.oy)*r;cs.scale*=r;applyT();}
      lastD=d;return;}lastD=null;if(!cs.drag)return;if(e.cancelable)e.preventDefault();const p=pos(e);cs.ox=p.x-cs.sx;cs.oy=p.y-cs.sy;applyT();
  }
  function up(){cs.drag=false;lastD=null;}
  con.addEventListener('mousedown',dn);con.addEventListener('touchstart',dn,{passive:false});
  window.addEventListener('mousemove',mv);window.addEventListener('touchmove',mv,{passive:false});
  window.addEventListener('mouseup',up);window.addEventListener('touchend',up);
  con.addEventListener('wheel',e=>{e.preventDefault();const rect=con.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,r=e.deltaY<0?1.08:.93;cs.ox=mx-(mx-cs.ox)*r;cs.oy=my-(my-cs.oy)*r;cs.scale*=r;applyT();},{passive:false});
})();

// ══ PROFILE IMG ════════════════════════════════════════════
// 초기 상태: 비관리자이므로 비활성화
document.getElementById('avatarInput').disabled = true;
document.getElementById('avCircle').style.cursor = 'default';

document.getElementById('avatarInput').addEventListener('change',function(e){
  if(!isAdmin)return;
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{
    document.getElementById('avImg').src=ev.target.result;
    document.getElementById('avImg').style.display='block';
    document.getElementById('avPh').style.display='none';
  };r.readAsDataURL(f);
});

render();
</script>
